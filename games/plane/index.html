<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>打飞机 · 游乐场</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="game-page">
      <header class="game-header">
        <a class="back-link" href="../../index.html">← 返回游戏库</a>
        <div class="game-title">
          <span class="title-mark">+</span>
          <div>
            <p>PLAYGROUND / 04</p>
            <h1>打飞机</h1>
          </div>
        </div>
        <button class="restart-button" id="restart" type="button">重新开始</button>
      </header>
      <section class="game-layout">
        <div class="board-wrap">
          <canvas id="board" width="480" height="640" aria-label="打飞机游戏区域"></canvas>
          <div class="overlay" id="overlay">
            <strong id="overlay-title">准备好了吗？</strong>
            <span id="overlay-copy">自动开火 · 吃道具升火力 · 30 秒后敌机开始还击</span>
            <button id="start" type="button">开始游戏</button>
          </div>
        </div>
        <aside class="side-panel">
          <div class="stat"><span>分数</span><strong id="score">0</strong></div>
          <div class="stat"><span>最高分</span><strong id="best">0</strong></div>
          <div class="stat lives"><span>生命</span><strong id="lives">✈ ✈ ✈</strong></div>
          <div class="stat"><span>火力</span><strong id="weapon">1</strong></div>
          <div class="stat shield"><span>护盾</span><strong id="shield">—</strong></div>
          <div class="stat missiles"><span>导弹</span><strong id="missiles">—</strong></div>
          <div class="difficulty">
            <span>难度</span>
            <div class="difficulty-selector" aria-label="难度选择">
              <button class="difficulty-button" data-difficulty="easy" type="button">简单</button>
              <button class="difficulty-button active" data-difficulty="normal" type="button">普通</button>
              <button class="difficulty-button" data-difficulty="hard" type="button">困难</button>
            </div>
          </div>
          <div class="controls">
            <span>操作说明</span>
            <p>WASD / 方向键，或鼠标 / 触屏拖动</p>
            <p>自动射击，击毁敌机得分</p>
            <p>道具：火 升火力 · 盾 挡一击 · 命 加血 · 导 导弹每级齐射 +1 枚</p>
            <p>30 秒后敌机还击，注意走位</p>
          </div>
          <div class="pad" aria-label="触屏方向键">
            <button data-direction="up" type="button">↑</button>
            <div>
              <button data-direction="left" type="button">←</button>
              <button data-direction="down" type="button">↓</button>
              <button data-direction="right" type="button">→</button>
            </div>
          </div>
        </aside>
      </section>
    </main>
    <script src="./js/game.js"></script>
  </body>
</html>
