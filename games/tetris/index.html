<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>俄罗斯方块 · 游乐场</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="game-page">
      <header class="game-header">
        <a class="back-link" href="../../index.html">← 返回游戏库</a>
        <div class="game-title">
          <span class="title-mark">+</span>
          <div>
            <p>PLAYGROUND / 01</p>
            <h1>俄罗斯方块</h1>
          </div>
        </div>
        <button class="restart-button" id="restart" type="button">重新开始</button>
      </header>
      <section class="game-layout">
        <div class="board-wrap">
          <canvas id="board" width="300" height="600" aria-label="俄罗斯方块游戏区域"></canvas>
          <div class="overlay" id="overlay">
            <strong id="overlay-title">准备好了吗？</strong>
            <span id="overlay-copy">按任意方向键开始</span>
            <button id="start" type="button">开始游戏</button>
          </div>
        </div>
        <aside class="side-panel">
          <div class="stat"><span>分数</span><strong id="score">0</strong></div>
          <div class="stat"><span>消行</span><strong id="lines">0</strong></div>
          <div class="next-box">
            <span>下一个</span>
            <canvas id="next" width="120" height="100"></canvas>
          </div>
          <div class="controls">
            <span>操作说明</span>
            <p>← → 移动</p>
            <p>↑ 旋转</p>
            <p>↓ 加速下落</p>
            <p>空格 直接落下</p>
          </div>
        </aside>
      </section>
    </main>
    <script src="./js/game.js"></script>
  </body>
</html>
